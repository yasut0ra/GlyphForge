name: Feature request
description: 新機能や品質改善を提案する
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: どのような利用場面で困っているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決方法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
  - type: dropdown
    id: area
    attributes:
      label: 対象領域
      options:
        - Glyph rendering
        - Image preprocessing
        - Optimization
        - AI providers / evaluation
        - Web UI
        - Documentation
        - その他
    validations:
      required: true
